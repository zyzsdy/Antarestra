# 按声明顺序加载；先声明定义与实现，再声明使用它们的入口插件。
# 多实例的随机哈希保存后保持不变，复制实例时生成新的哈希。
plugins:
  plugin-logger: {}
  plugin-hmr:
    include: [plugins]
    exclude: []
  database: {}
  plugin-database-kysely:
    type: postgresql
    url: $ANTARESTRA_DATABASE_URL
  plugin-server: {}
  webui: {}
  rbac: {}
  plugin-auth-local:
    providerId: local
    allowRegistration: true
    # 首次创建管理员时取消以下注释，并在环境变量中设置密码。
    # bootstrapEmail: admin@ikp.yt
    # bootstrapPassword: $ANTARESTRA_ADMIN_PASSWORD
  agent: {}
  agent-demo:9ce0b8f2:
    backendId: demo-a
    prefix: 演示实例甲：
  agent-demo:73f1a6d4:
    backendId: demo-b
    prefix: 演示实例乙：
  adapter-cli: {}
  # 在插件名之前加 ~ 禁用，保留该实例的配置。
  ~agent-demo:d4f706a9:
    backendId: demo-disabled
    prefix: 已禁用实例：
