# 按声明顺序加载；先声明定义与实现，再声明使用它们的入口插件。
# 多实例的随机哈希保存后保持不变，复制实例时生成新的哈希。
plugins:
  logger: {}
  http: {}
  playwright:
    proxy:
      server: socks5://127.0.0.1:7890
    context:
      ignoreHTTPSErrors: true
      viewport:
        width: 1920
        height: 1000
      deviceScaleFactor: 2
      isMobile: false
      hasTouch: false
  puppeteer:
    args: ['--proxy-server=socks5://127.0.0.1:7890']
    acceptInsecureCerts: true
    defaultViewport:
      width: 1920
      height: 1000
      deviceScaleFactor: 2
      isMobile: false
      hasTouch: false
  hmr:
    include: [plugins]
    exclude: []
  database: {}
  database-kysely:
    type: postgresql
    url: $ANTARESTRA_DATABASE_URL
  server: {}
  webui: {}
  rbac: {}
  storage: {}
  # 运行 pnpm startdevstorage 和 pnpm initdevstorage 后启用；凭据从环境读取。
  storage-s3:
    endpoint: http://127.0.0.1:19000
    region: us-east-1
    bucket: antarestra-dev
    accessKeyId: $ANTARESTRA_S3_ACCESS_KEY
    secretAccessKey: $ANTARESTRA_S3_SECRET_KEY
    forcePathStyle: true
  workspace-file:
    backendId: s3
    defaultQuota: 1073741824
  ai: {}
  ai-agent-core: {}
  basic-tools: {}
  web-tools:
    apiKey: $SERPER_API_KEY
    searchProxy: socks5://127.0.0.1:7890
  auth-local:
    providerId: local
    allowRegistration: false
    # 首次创建管理员时取消以下注释，并在环境变量中设置密码。
    # bootstrapEmail: admin@ikp.yt
    # bootstrapPassword: $ANTARESTRA_ADMIN_PASSWORD
  admin-console: {}
  ai-provider: {}
  ai-agents: {}
  config-panel: {}
  markdown-render: {}
  chat-webui: {}
