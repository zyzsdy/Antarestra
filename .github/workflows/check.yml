name: 项目检查

on:
  push:
  pull_request:

jobs:
  check:
    name: 检查与构建
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 执行检查
        run: pnpm check
      - name: 验证服务端启动
        run: node scripts/smoke-server.mjs

  database:
    name: PostgreSQL 与 MySQL 集成检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: antarestra-test
          POSTGRES_USER: antarestra
          POSTGRES_DB: antarestra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U antarestra"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: antarestra-test
          MYSQL_DATABASE: antarestra
          MYSQL_USER: antarestra
          MYSQL_PASSWORD: antarestra-test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pantarestra-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 验证三种真实数据库
        run: pnpm exec vitest run tests/integration/database.test.ts tests/integration/rbac.test.ts
        env:
          ANTARESTRA_TEST_POSTGRES: postgres://antarestra:antarestra-test@127.0.0.1:5432/antarestra
          ANTARESTRA_TEST_MYSQL: mysql://antarestra:antarestra-test@127.0.0.1:3306/antarestra
