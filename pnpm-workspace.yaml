packages:
  - apps/*
  - packages/*
  - plugins/definitions/*
  - plugins/implementations/*
  - plugins/features/*
  - plugins/adapters/*
allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  protobufjs: false
  vue-demi: true
minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@0.99.1'
  - '@earendil-works/pi-telemetry@0.99.1'
